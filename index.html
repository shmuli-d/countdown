<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melbourne Daylight Saving Countdown</title>
  <style>
    :root {
      --sky-top:#49bff2;
      --sky-bottom:#c9f3ff;
      --sea-light:#2fd0df;
      --sea-mid:#139fcb;
      --sea-dark:#06759f;
      --sand:#f4cf7c;
      --ink:#07364b;
    }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      overflow:hidden;
      font-family:Arial, Helvetica, sans-serif;
      color:#fff;
      background:linear-gradient(to bottom, var(--sky-top) 0 44%, var(--sky-bottom) 44% 50%, var(--sea-mid) 50% 72%, var(--sand) 72% 100%);
    }
    .scene { position:relative; width:100%; height:100%; overflow:hidden; isolation:isolate; }

    /* Sky */
    .sun {
      position:absolute; right:8vw; top:7vh; width:105px; height:105px;
      border-radius:50%; background:#ffd85a;
      box-shadow:0 0 0 14px rgba(255,216,90,.16), 0 0 55px rgba(255,216,90,.75);
      animation:pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse { to { transform:scale(1.06); } }
    .cloud { position:absolute; width:145px; height:42px; border-radius:40px; background:rgba(255,255,255,.86); filter:drop-shadow(0 5px 4px rgba(0,90,130,.12)); }
    .cloud:before, .cloud:after { content:""; position:absolute; background:inherit; border-radius:50%; }
    .cloud:before { width:65px; height:65px; left:22px; bottom:4px; }
    .cloud:after { width:78px; height:78px; right:14px; bottom:2px; }
    .c1 { top:14vh; left:-180px; animation:cloud-drift 31s linear infinite; }
    .c2 { top:28vh; left:-220px; transform:scale(.66); opacity:.8; animation:cloud-drift-small 39s linear -17s infinite; }
    @keyframes cloud-drift { to { transform:translateX(calc(100vw + 400px)); } }
    @keyframes cloud-drift-small { to { transform:translateX(calc(152vw + 500px)) scale(.66); } }

    /* Ocean, made from oversized rounded layers */
    .ocean { position:absolute; left:0; right:0; top:49%; height:27%; overflow:hidden; z-index:1; }
    .wave { position:absolute; left:-20%; width:140%; height:145px; border-radius:50%; }
    .wave.a { top:18px; background:var(--sea-light); opacity:.78; animation:wave-a 6s ease-in-out infinite; }
    .wave.b { top:65px; background:var(--sea-mid); opacity:.9; animation:wave-b 8s ease-in-out infinite; }
    .wave.c { top:112px; background:var(--sea-dark); animation:wave-a 10s ease-in-out -3s infinite; }
    .foam { position:absolute; bottom:-2px; left:-8%; width:116%; height:42px; border-radius:50%; border-top:12px solid rgba(255,255,255,.9); animation:foam 4s ease-in-out infinite alternate; }
    @keyframes wave-a { 0%,100% { transform:translateX(-2%) rotate(-1deg); } 50% { transform:translateX(4%) rotate(1deg); } }
    @keyframes wave-b { 0%,100% { transform:translateX(4%) rotate(1deg); } 50% { transform:translateX(-3%) rotate(-1deg); } }
    @keyframes foam { from { transform:translateX(-2%) scaleY(.8); } to { transform:translateX(2%) scaleY(1.15); } }

    /* Sand */
    .sand { position:absolute; left:0; right:0; bottom:0; height:29%; z-index:2; background:linear-gradient(#f8d98e,#eab863); }
    .sand:before { content:""; position:absolute; inset:0; opacity:.20; background-image:radial-gradient(#8f642c 1px, transparent 1px); background-size:25px 21px; }

    /* Palms */
    .palm { position:absolute; bottom:5%; width:220px; height:390px; z-index:7; transform-origin:50% 100%; animation:sway 4s ease-in-out infinite alternate; }
    .palm.left { left:-25px; }
    .palm.right { right:-25px; transform:scaleX(-1); animation-name:sway-right; }
    .trunk { position:absolute; left:96px; bottom:0; width:35px; height:255px; border-radius:55% 45% 18% 18%; transform:rotate(-7deg); transform-origin:bottom; background:repeating-linear-gradient(-12deg,#925025 0 18px,#c77a39 19px 36px); box-shadow:inset 7px 0 rgba(255,255,255,.12); }
    .crown { position:absolute; left:106px; top:89px; }
    .leaf { position:absolute; left:0; top:0; width:142px; height:39px; border-radius:100% 10% 100% 10%; transform-origin:0 50%; background:linear-gradient(145deg,#39be58,#09773b); box-shadow:inset 0 -7px rgba(0,75,35,.16); }
    .l1{transform:rotate(-82deg)} .l2{transform:rotate(-48deg)} .l3{transform:rotate(-16deg)} .l4{transform:rotate(18deg)} .l5{transform:rotate(55deg)} .l6{transform:rotate(96deg)} .l7{transform:rotate(142deg)}
    .coconut { position:absolute; width:24px; height:24px; border-radius:50%; background:#744420; top:14px; }
    .co1{left:-5px}.co2{left:18px;top:26px}
    @keyframes sway { from{transform:rotate(-1.5deg)} to{transform:rotate(2deg)} }
    @keyframes sway-right { from{transform:scaleX(-1) rotate(-1.5deg)} to{transform:scaleX(-1) rotate(2deg)} }

    /* Volleyball court */
    .court { position:absolute; left:50%; bottom:5%; width:min(650px,68vw); height:225px; transform:translateX(-50%); z-index:5; }
    .pole { position:absolute; bottom:0; width:11px; height:210px; background:#fff; border-radius:7px; box-shadow:0 4px 5px rgba(0,0,0,.22); }
    .pole.left{left:5%}.pole.right{right:5%}
    .net { position:absolute; left:calc(5% + 9px); right:calc(5% + 9px); top:27px; height:120px; border:5px solid #fff; background-color:rgba(255,255,255,.05); background-image:linear-gradient(rgba(255,255,255,.85) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.85) 2px,transparent 2px); background-size:25px 25px; }
    .ball { position:absolute; left:50%; top:-18px; width:47px; height:47px; margin-left:-24px; border:3px solid #fff; border-radius:50%; background:conic-gradient(#fff 0 60deg,#ffd64a 60deg 120deg,#fff 120deg 180deg,#258fd4 180deg 240deg,#fff 240deg 300deg,#ffd64a 300deg); box-shadow:0 6px 7px rgba(0,0,0,.22); animation:ball 3.2s ease-in-out infinite; }
    @keyframes ball { 0%,100%{transform:translate(-150px,55px) rotate(0)} 50%{transform:translate(150px,-38px) rotate(360deg)} }

    /* Beach accessories replacing the players */
    .beach-item { position:absolute; z-index:3; }

    .towel { bottom:0; width:92px; height:38px; border-radius:8px; transform:skewX(-16deg); box-shadow:0 5px 5px rgba(0,0,0,.16); }
    .towel:after { content:""; position:absolute; inset:0; border-radius:inherit; background:repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.7) 15px 22px); }
    .towel.one { left:7%; background:#ff6172; }
    .towel.two { right:7%; background:#49aee8; transform:skewX(14deg); }

    .surfboard { bottom:22px; width:31px; height:132px; border-radius:55% 55% 48% 48%; box-shadow:0 5px 7px rgba(0,0,0,.2); }
    .surfboard:before { content:""; position:absolute; left:13px; top:8px; width:5px; height:112px; border-radius:4px; background:rgba(255,255,255,.85); }
    .surfboard.one { left:16%; background:#ffca3a; transform:rotate(-13deg); }
    .surfboard.two { right:16%; background:#8b5cf6; transform:rotate(13deg); }

    .chair { bottom:3px; width:78px; height:83px; }
    .chair .seat { position:absolute; left:10px; top:27px; width:58px; height:42px; border-radius:7px; transform:skewX(-9deg); background:repeating-linear-gradient(90deg,#fff 0 9px,#ef5b67 9px 18px); border:4px solid #fff; }
    .chair:before,.chair:after { content:""; position:absolute; bottom:0; width:6px; height:70px; border-radius:5px; background:#71472e; }
    .chair:before { left:17px; transform:rotate(19deg); }
    .chair:after { right:17px; transform:rotate(-19deg); }
    .chair.one { left:24%; }
    .chair.two { right:24%; transform:scaleX(-1); }

    .umbrella { bottom:2px; width:145px; height:144px; }
    .umbrella .canopy { position:absolute; top:0; left:0; width:145px; height:72px; overflow:hidden; }
    .umbrella .canopy:before { content:""; position:absolute; width:145px; height:145px; border-radius:50%; background:conic-gradient(from 270deg,#ff5b67 0 30deg,#ffd34e 30deg 60deg,#ff5b67 60deg 90deg,#ffd34e 90deg 120deg,#ff5b67 120deg 150deg,#ffd34e 150deg 180deg,transparent 180deg); }
    .umbrella .stem { position:absolute; left:70px; top:59px; width:6px; height:85px; border-radius:5px; background:#f5f5f5; transform:rotate(5deg); }
    .umbrella.one { left:30%; transform:scale(.72); transform-origin:bottom; }
    .umbrella.two { right:30%; transform:scale(.72) scaleX(-1); transform-origin:bottom; }

    .seagull { position:absolute; top:-60px; width:52px; height:25px; animation:gull-float 3.5s ease-in-out infinite alternate; }
    .seagull:before,.seagull:after { content:""; position:absolute; top:7px; width:29px; height:13px; border-top:5px solid #fff; border-radius:50%; filter:drop-shadow(0 2px 1px rgba(0,0,0,.18)); }
    .seagull:before { left:0; transform:rotate(16deg); }
    .seagull:after { right:0; transform:rotate(-16deg); }
    .seagull.one { left:16%; }
    .seagull.two { right:12%; animation-delay:-1.5s; transform:scale(.8); }
    .seagull.three { left:65%; top:-105px; animation-delay:-2.4s; transform:scale(.65); }
    @keyframes gull-float { from { margin-top:0; } to { margin-top:-16px; } }

    /* Countdown panel */
    .panel { position:relative; z-index:20; width:min(880px,90vw); margin:7vh auto 0; padding:28px 24px 25px; text-align:center; border:2px solid rgba(255,255,255,.38); border-radius:25px; background:rgba(3,56,80,.66); box-shadow:0 18px 44px rgba(0,0,0,.28); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,4.5vw,3.25rem); line-height:1.05; text-shadow:0 3px 7px rgba(0,0,0,.32); }
    .subtitle { margin:0 0 23px; font-size:clamp(.92rem,2vw,1.16rem); }
    #countdown { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
    .unit { min-width:132px; padding:18px 13px; border-radius:17px; background:rgba(255,255,255,.18); box-shadow:inset 0 1px rgba(255,255,255,.32); }
    .number { font-size:clamp(2.5rem,6vw,4.2rem); font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
    .label { margin-top:8px; font-size:.78rem; font-weight:700; letter-spacing:1.7px; text-transform:uppercase; }
    #message { display:none; font-size:clamp(1.6rem,4vw,2.8rem); font-weight:800; }
    .clock-note { margin:16px 0 0; font-size:.82rem; opacity:.86; }

    @media (max-width:680px) {
      .panel { margin-top:3vh; padding:21px 13px; }
      .unit { min-width:42%; padding:13px 8px; }
      .palm { opacity:.9; transform:scale(.72); transform-origin:bottom left; }
      .palm.right { transform:scaleX(-1) scale(.72); transform-origin:bottom right; }
      .court { width:92vw; transform:translateX(-50%) scale(.82); transform-origin:bottom center; }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *:before, *:after { animation-duration:.001ms !important; animation-iteration-count:1 !important; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud c1" aria-hidden="true"></div>
    <div class="cloud c2" aria-hidden="true"></div>

    <div class="ocean" aria-hidden="true">
      <div class="wave a"></div><div class="wave b"></div><div class="wave c"></div><div class="foam"></div>
    </div>
    <div class="sand" aria-hidden="true"></div>

    <div class="palm left" aria-hidden="true"><div class="trunk"></div><div class="crown"><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i><i class="leaf l5"></i><i class="leaf l6"></i><i class="leaf l7"></i><i class="coconut co1"></i><i class="coconut co2"></i></div></div>
    <div class="palm right" aria-hidden="true"><div class="trunk"></div><div class="crown"><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i><i class="leaf l5"></i><i class="leaf l6"></i><i class="leaf l7"></i><i class="coconut co1"></i><i class="coconut co2"></i></div></div>

    <div class="court" aria-hidden="true">
      <div class="pole left"></div><div class="net"></div><div class="pole right"></div><div class="ball"></div>
      <div class="beach-item towel one"></div><div class="beach-item towel two"></div>
      <div class="beach-item surfboard one"></div><div class="beach-item surfboard two"></div>
      <div class="beach-item chair one"><div class="seat"></div></div><div class="beach-item chair two"><div class="seat"></div></div>
      <div class="beach-item umbrella one"><div class="canopy"></div><div class="stem"></div></div>
      <div class="beach-item umbrella two"><div class="canopy"></div><div class="stem"></div></div>
      <div class="seagull one"></div><div class="seagull two"></div><div class="seagull three"></div>
    </div>

    <main class="panel">
      <h1>Daylight Saving Countdown</h1>
      <p class="subtitle">Melbourne clocks spring forward at 2:00 AM on Sunday 4 October 2026</p>
      <div id="countdown" aria-live="polite">
        <div class="unit"><div class="number" id="days">--</div><div class="label">Days</div></div>
        <div class="unit"><div class="number" id="hours">--</div><div class="label">Hours</div></div>
        <div class="unit"><div class="number" id="minutes">--</div><div class="label">Minutes</div></div>
        <div class="unit"><div class="number" id="seconds">--</div><div class="label">Seconds</div></div>
      </div>
      <div id="message">Daylight saving has started! ☀️</div>
      <p class="clock-note" id="status">Countdown calculated to Melbourne local time.</p>
    </main>
  </div>

  <script>
    (function () {
      "use strict";
      var target = new Date("2026-10-04T02:00:00+10:00").getTime();
      var countdown = document.getElementById("countdown");
      var message = document.getElementById("message");
      var status = document.getElementById("status");
      var daysEl = document.getElementById("days");
      var hoursEl = document.getElementById("hours");
      var minutesEl = document.getElementById("minutes");
      var secondsEl = document.getElementById("seconds");

      function pad(value) { return String(value).padStart(2, "0"); }

      function update() {
        var diff = target - Date.now();
        if (diff <= 0) {
          countdown.style.display = "none";
          message.style.display = "block";
          status.textContent = "Clocks have moved forward from 2:00 AM to 3:00 AM.";
          return;
        }
        var day = 86400000, hour = 3600000, minute = 60000;
        daysEl.textContent = String(Math.floor(diff / day));
        hoursEl.textContent = pad(Math.floor((diff % day) / hour));
        minutesEl.textContent = pad(Math.floor((diff % hour) / minute));
        secondsEl.textContent = pad(Math.floor((diff % minute) / 1000));
      }

      update();
      window.setInterval(update, 1000);
    }());
  </script>
</body>
</html>
